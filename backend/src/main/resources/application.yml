spring:
  application:
    name: meridianops
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:meridianops;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:true}
    path: /graphql

server:
  port: ${PORT:${SERVER_PORT:8080}}

meridianops:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.springframework.security: INFO
    com.meridianops: INFO
