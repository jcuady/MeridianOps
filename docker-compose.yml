services:
  mysql:
    image: mysql:8.0
    container_name: meridianops-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-meridian_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meridianops}
      MYSQL_USER: ${MYSQL_USER:-meridian}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-meridian_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-meridian_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
