# MeridianOps API on Render (H2 free-tier demo). Set CORS_ORIGINS to your Vercel URL.
services:
  - type: web
    name: meridianops-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: SERVER_PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: GRAPHIQL_ENABLED
        value: "true"
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:mem:meridianops;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
      - key: SPRING_DATASOURCE_DRIVER
        value: org.h2.Driver
